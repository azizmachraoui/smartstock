services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: echo "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --quiet
      interval: 5s
      retries: 20
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: { MONGO_URI: "mongodb://mongo:27017/smartstock?directConnection=true" }
    ports: ["4000:4000"]
    depends_on: [mongo]
volumes: { mongo_data: {} }
