services:
  - type: web
    name: smartstock-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:shared && npm run build:api
    startCommand: npm run start -w @smartstock/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
