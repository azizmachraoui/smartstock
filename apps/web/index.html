<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1220" />
    <meta
      name="description"
      content="SmartStock — inventory, purchasing and stock control for modern operations teams."
    />
    <!-- Open Graph & Social Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SmartStock — Inventory & Operations Control" />
    <meta property="og:description" content="Real-time multi-tier inventory, stock movement tracking, purchasing workflows, and automated low-stock notifications." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartStock — Inventory Control" />
    <meta name="twitter:description" content="Real-time multi-tier inventory and stock movement tracking for modern teams." />
    <title>SmartStock — Inventory Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('smartstock:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
